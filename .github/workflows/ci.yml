# CI for pull requests and main. No repository secrets: the test suite is hermetic,
# and nothing here settles testnet USDC (the FR-34 e2e stays a manual run).
# No tokens are used at all.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  audit:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # npm audit --omit=dev, minus the dated exceptions in .audit-allowlist.json;
      # fails on any other high or critical advisory, and on an expired exception.
      - run: npm run audit:check

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The same gitleaks release the maintainers run locally, so the local gate and CI
      # agree. gitleaks-action pins an older release whose default rules differ, and it
      # flagged test fixtures the current release does not.
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan every commit, then the checkout
        run: |
          gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
          gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit carries Signed-off-by
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          commits=$(git rev-list --no-merges "origin/${BASE_REF}..HEAD")
          missing=0
          for sha in $commits; do
            msg=$(git log -1 --format=%B "$sha")
            if ! grep -qE '^Signed-off-by: .+ <.+>' <<<"$msg"; then
              echo "::error::Commit ${sha} has no Signed-off-by trailer. Sign with 'git commit -s'; see CONTRIBUTING.md."
              missing=1
            fi
          done
          exit $missing
